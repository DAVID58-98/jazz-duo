name: Galerie

# Po nahrání / smazání fotky ve složce foto/ vygeneruje foto/galerie.json
# (seznam fotek seřazený od nejnovější) a web si ho při načtení přečte.
# Název fotky = datum akce RRRR-MM-DD (např. 2026-10-27.webp, další ze stejného dne 2026-10-27-2.webp).
# Fotku pojmenovanou evropsky (27-10-2026.webp) Action sama přejmenuje na 2026-10-27.webp.

on:
  push:
    branches: [main]
    paths:
      - 'foto/**'
      - '!foto/galerie.json'
      - '!foto/README.md'
      - '.github/workflows/galerie.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: galerie
  cancel-in-progress: false

jobs:
  seznam:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # vždy nejnovější stav (i když se fotky nahrávají rychle po sobě)
          fetch-depth: 0

      - name: Přejmenovat fotky a vygenerovat foto/galerie.json
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json
          import re
          import subprocess
          from pathlib import Path

          FOTO = Path("foto")
          OBRAZKY = {".webp", ".jpg", ".jpeg", ".png", ".avif"}
          BEZPECNY_NAZEV = re.compile(r"^[A-Za-z0-9._-]+$")
          DATUM_ISO = re.compile(r"^(\d{4})-(\d{2})-(\d{2})")            # 2026-10-27.webp, 2026-10-27-2.webp
          DATUM_EU = re.compile(r"^(\d{2})-(\d{2})-(\d{4})(.*)$")        # 27-10-2026.webp → přejmenuje se
          MAX_KB = 400

          # 0) hromadné přejmenování podle foto/prejmenovat.txt (řádky "stary.webp -> novy.webp"); soubor se pak smaže
          seznam = FOTO / "prejmenovat.txt"
          if seznam.exists():
              for radek in seznam.read_text(encoding="utf-8").splitlines():
                  if "->" not in radek or radek.strip().startswith("#"):
                      continue
                  stary, novy = (FOTO / s.strip() for s in radek.split("->", 1))
                  m = DATUM_EU.match(stary.name)
                  if not stary.exists() and m:
                      # mezitím už mohla být přejmenovaná z DD-MM-RRRR na RRRR-MM-DD
                      den, mesic, rok, zbytek = m.groups()
                      stary = FOTO / f"{rok}-{mesic}-{den}{zbytek}"
                  if not stary.exists():
                      print(f"::warning::Přejmenování: {stary.name} neexistuje – přeskočeno.")
                  elif novy.exists():
                      print(f"::warning::Přejmenování: {novy.name} už existuje – {stary.name} přeskočeno.")
                  else:
                      stary.rename(novy)
                      print(f"Přejmenováno: {stary.name} → {novy.name}")
              seznam.unlink()   # změny uloží krok níže (git add -A foto)

          # 1) evropský tvar DD-MM-RRRR → RRRR-MM-DD (aby se fotky řadily podle data i ve složce na GitHubu)
          for p in sorted(FOTO.iterdir()):
              m = DATUM_EU.match(p.name)
              if not p.is_file() or p.suffix.lower() not in OBRAZKY or not m:
                  continue
              den, mesic, rok, zbytek = m.groups()
              cil = FOTO / f"{rok}-{mesic}-{den}{zbytek}"
              if cil.exists():
                  print(f"::warning file={p}::Nelze přejmenovat na {cil.name} – takový soubor už existuje. Přidej na konec -2, -3 …")
                  continue
              p.rename(cil)
              print(f"Přejmenováno: {p.name} → {cil.name}")

          def datum_nahrani(path):
              # datum prvního commitu, ve kterém se soubor objevil
              out = subprocess.check_output(
                  ["git", "log", "--diff-filter=A", "--follow", "--format=%cs", "--", str(path)]
              ).decode().split()
              return out[-1] if out else "0000-00-00"

          def prirozene(nazev):
              # podle názvu bez přípony: 2026-10-27 → 2026-10-27-2 → … → 2026-10-27-10
              stem = nazev.rsplit(".", 1)[0]
              return [int(t) if t.isdigit() else t.lower() for t in re.split(r"(\d+)", stem)]

          # 2) seznam pro galerii
          polozky = []
          for p in FOTO.iterdir():
              if not p.is_file() or p.suffix.lower() not in OBRAZKY:
                  continue
              if not BEZPECNY_NAZEV.match(p.name):
                  print(f"::warning file={p}::Název obsahuje mezery, diakritiku nebo zvláštní znaky – fotka se do galerie NEPŘIDÁ. Přejmenuj ji podle foto/README.md.")
                  continue
              if p.suffix.lower() != ".webp":
                  print(f"::warning file={p}::Fotka není ve formátu WebP. Funguje, ale je zbytečně velká – viz foto/README.md.")
              kb = p.stat().st_size / 1024
              if kb > MAX_KB:
                  print(f"::warning file={p}::Fotka má {kb:.0f} kB (doporučeno max. {MAX_KB} kB) – zpomaluje web.")
              m = DATUM_ISO.match(p.name)
              if m:
                  datum = "-".join(m.groups())
              else:
                  print(f"::notice file={p}::V názvu není datum (RRRR-MM-DD), použije se datum nahrání.")
                  datum = datum_nahrani(p)
              polozky.append((datum, p.name))

          # nejnovější první; při stejném datu: bez čísla, pak -2, -3 …
          polozky.sort(key=lambda x: prirozene(x[1]))
          polozky.sort(key=lambda x: x[0], reverse=True)

          data = {"files": [n for _, n in polozky]}
          (FOTO / "galerie.json").write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("Pořadí v galerii:")
          for d, n in polozky:
              r, mm, dd = d.split("-")
              print(f"  {dd}.{mm}.{r}  {n}")
          PYTHON

      - name: Uložit, pokud se něco změnilo
        id: commit
        shell: bash
        run: |
          git add -A foto
          if git diff --cached --quiet; then
            echo "Seznam fotek se nezměnil."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Galerie: aktualizace seznamu fotek"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Znovu publikovat web
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # commit od github-actions nemusí sám spustit publikování GitHub Pages
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null \
            && echo "Publikování spuštěno." \
            || echo "::notice::Publikování se nepodařilo spustit ručně – web se aktualizuje při příštím pushi."
