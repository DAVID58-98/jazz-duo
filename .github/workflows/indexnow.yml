name: IndexNow

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'sitemap.xml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  oznam:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Overit nasazeni a odeslat do IndexNow
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import subprocess
          import time
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urlsplit, quote
          
          HOST = "jazzduo.cz"
          BASE = "https://" + HOST
          KEY = "bb7f36b3bffd555f05d1c22063954749"
          NS = {"s": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          
          def sitemap_urls(xml):
              return {n.text.strip() for n in ET.fromstring(xml).findall("s:url/s:loc", NS)
                      if n.text and urlsplit(n.text.strip()).netloc == HOST}
          
          current = sitemap_urls(Path("sitemap.xml").read_text())
          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              urls = current
          else:
              before = os.environ["BEFORE_SHA"]
              # A new branch has no previous commit.
              if not before or set(before) == {"0"}:
                  urls = current
              else:
                  changed = subprocess.check_output(
                      ["git", "diff", "--name-only", "--no-renames", "-z", before, "HEAD"],
                  ).decode().split("\0")
                  old = sitemap_urls(subprocess.check_output(
                      ["git", "show", before + ":sitemap.xml"]).decode())
                  if "sitemap.xml" in changed:
                      urls = current | old
                  else:
                      urls = set()
                      for name in changed:
                          if name.endswith(".html"):
                              path = name[:-10] if name.endswith("index.html") else name
                              url = BASE + "/" + quote(path, safe="/")
                              if url in current | old:
                                  urls.add(url)
          
          if not urls:
              print("Zadne zmenene URL ze sitemap.xml. Neni co odeslat.")
              raise SystemExit(0)
          
          # Wait for GitHub Pages to publish the key and the selected current pages.
          expected = {BASE + "/" + KEY + ".txt": KEY.encode()}
          for url in urls & current:
              path = urlsplit(url).path.lstrip("/")
              if not path or path.endswith("/"):
                  path += "index.html"
              file = Path(path)
              if file.is_file():
                  expected[url] = file.read_bytes()
          
          for attempt in range(20):
              pending = []
              for url, content in expected.items():
                  try:
                      request = urllib.request.Request(url, headers={"Cache-Control": "no-cache"})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          if response.read() != content:
                              pending.append(url)
                  except (urllib.error.URLError, TimeoutError):
                      pending.append(url)
              if not pending:
                  break
              print("Cekam na publikovani GitHub Pages:", ", ".join(pending), flush=True)
              if attempt == 19:
                  raise SystemExit("Web jeste neodpovida souborum v repozitari. Po nasazeni spustte workflow znovu.")
              time.sleep(30)
          
          payload = {"host": HOST, "key": KEY,
                     "keyLocation": BASE + "/" + KEY + ".txt", "urlList": sorted(urls)}
          print("Ohlasuji:")
          print("\n".join(sorted(urls)))
          request = urllib.request.Request("https://api.indexnow.org/IndexNow",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json; charset=utf-8"}, method="POST")
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  status = response.status
          except urllib.error.HTTPError as error:
              print(error.read().decode(errors="replace"))
              raise SystemExit(f"IndexNow chyba HTTP {error.code}")
          print(f"Odpoved: {status}")
          if status == 202:
              print("::warning::URL prijaty, IndexNow jeste overuje klic. Pozdeji zkontrolujte Bing; pripadne workflow spustte znovu.")
          elif status != 200:
              raise SystemExit(f"Neocekavana odpoved HTTP {status}")
          PYTHON
